name: Sync Incidents to Portfolio

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  generate-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Scenarios Repo
        uses: actions/checkout@v4
        with:
          path: scenarios-repo

      - name: Checkout Target Portfolio Repo
        uses: actions/checkout@v4
        with:
          repository: arian-0058/arian-0058.github.io
          token: ${{ secrets.SYNC_TOKEN }}
          path: portfolio-repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse Runbooks & Generate incidents.json
        shell: python3 {0}
        run: |
          import os
          import json
          import re
          from urllib.parse import quote

          base_dir = "scenarios-repo"
          incidents = []
          counter = 1

          dirs = sorted([
              d for d in os.listdir(base_dir)
              if os.path.isdir(os.path.join(base_dir, d)) and not d.startswith(".")
          ])

          for idx, folder in enumerate(dirs, start=1):
              clean_slug = re.sub(r'^\d+[-_\s]*', '', folder).strip()
              cat_key = re.sub(r'[^a-z0-9]+', '-', clean_slug.lower()).strip('-') or f"module-{idx}"
              pretty_name = re.sub(r'[-_]+', ' ', clean_slug or folder).title()
              category_label = f"{idx}. {pretty_name}"

              folder_path = os.path.join(base_dir, folder)
              for root, subdirs, files in os.walk(folder_path):
                  subdirs[:] = sorted([s for s in subdirs if not s.startswith(".")])
                  for file in sorted(files):
                      if file.lower().endswith(".md") and file.lower() != "readme.md":
                          file_path = os.path.join(root, file)
                          rel_path = os.path.relpath(file_path, base_dir).replace(os.sep, "/")

                          with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()

                          title_match = re.search(r"^#{1,2}\s+(.*)", content, re.MULTILINE)
                          if title_match:
                              title = title_match.group(1).strip()
                          else:
                              title = os.path.splitext(file)[0].replace("-", " ").title()

                          upper_content = content.upper()
                          if "CRITICAL" in upper_content:
                              severity = "CRITICAL"
                          elif "MEDIUM" in upper_content:
                              severity = "MEDIUM"
                          else:
                              severity = "HIGH"

                          name_no_ext = os.path.splitext(file)[0]
                          tags = [t.lower() for t in re.sub(r'^\d+[-_]?', '', name_no_ext).split("-") if not t.isdigit() and len(t) > 2][:4]
                          if not tags:
                              tags = [cat_key, "troubleshooting"]

                          github_url = f"https://github.com/arian-0058/devops-troubleshooting-scenario/blob/main/{quote(rel_path)}"

                          incidents.append({
                              "id": f"{cat_key}-{counter:02d}",
                              "category": cat_key,
                              "category_label": category_label,
                              "title": title,
                              "severity": severity,
                              "tags": tags,
                              "steps": "Problem -> Failure Injection -> Symptoms -> RCA -> Fix -> Lesson Learned",
                              "github_url": github_url
                          })
                          counter += 1

          target_path = "portfolio-repo/incidents.json"
          with open(target_path, "w", encoding="utf-8") as f:
              json.dump(incidents, f, indent=2, ensure_ascii=False)

          print(f"Generated {len(incidents)} incidents across {len(dirs)} folders: {dirs}")

      - name: Commit and Push to Portfolio Repo
        run: |
          cd portfolio-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incidents.json
          if git diff --staged --quiet; then
            echo "No changes in incidents database."
          else
            git commit -m "chore(data): auto-sync incidents from devops-troubleshooting-scenario"
            git push origin main
          fi
